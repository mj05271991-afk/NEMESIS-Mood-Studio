name: Build Moon Native Audio and Android Integration

on:
  workflow_dispatch:
  push:
    branches: [fix/audio-loopback-ui]
    paths:
      - 'engineering/native/**'
      - 'engineering/hmgapi-mod/**'
      - 'app/**'
      - '.github/workflows/native-audio-probe.yml'

jobs:
  native-probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig and pinned TinyALSA
        run: |
          python3 -m pip install --user ziglang
          git clone https://github.com/tinyalsa/tinyalsa third_party/tinyalsa
          git -C third_party/tinyalsa checkout a7cd26a17fe2add2ff38d2f281ed0b919187a068
      - name: Compile ARMv7 audio diagnostic
        run: bash engineering/native/build-probe.sh
      - name: Check ARM architecture
        run: |
          test -s build/native/moon_audio_probe
          test -s build/native/moonaudiod
          file build/native/moon_audio_probe | grep -E 'ARM|arm'
          file build/native/moonaudiod | grep -E 'ARM|arm'
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Android SDK and Gradle
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
          wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-6.7.1/bin/gradle --version
      - name: Compile APK
        run: |
          java -version
          /tmp/gradle-6.7.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage combined HMG-API development payload
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build/moon-hmgapi-dev/app
          cp build/native/moonaudiod build/moon-hmgapi-dev/moonaudiod
          cp app/build/outputs/apk/debug/app-debug.apk build/moon-hmgapi-dev/app/MoonStudio.apk
          cp engineering/hmgapi-mod/mod.json engineering/hmgapi-mod/audio.sh build/moon-hmgapi-dev/
          chmod 755 build/moon-hmgapi-dev/audio.sh build/moon-hmgapi-dev/moonaudiod
          (cd build && zip -qr Moon-HMGAPI-INTEGRATION-UNTESTED.zip moon-hmgapi-dev)
      - name: Validate integrated APK and native service payload
        run: |
          set -euo pipefail
          test -s build/moon-hmgapi-dev/moonaudiod
          test -s build/moon-hmgapi-dev/app/MoonStudio.apk
          test -s build/moon-hmgapi-dev/audio.sh
          test -s build/moon-hmgapi-dev/mod.json
          sh -n build/moon-hmgapi-dev/audio.sh
          python3 - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('build/moon-hmgapi-dev')
          mod = json.loads((root/'mod.json').read_text())
          assert mod['id'] == 'moon-studio'
          assert any(a['package'] == 'com.nemesis.moonstudio' and (root/a['apk']).is_file() for a in mod['apps'])
          assert any((root/s['script']).is_file() for s in mod['services'])
          script = (root/'audio.sh').read_text()
          assert '/data/data/com.nemesis.moonstudio/files/settings' in script
          assert 'moonaudiod' in script
          apk = root/'app/MoonStudio.apk'
          with zipfile.ZipFile(apk) as z:
              assert 'classes.dex' in z.namelist()
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'assets/index.html' in z.namelist()
          with zipfile.ZipFile('build/Moon-HMGAPI-INTEGRATION-UNTESTED.zip') as z:
              names = set(z.namelist())
              for p in ('moonaudiod','mod.json','audio.sh','app/MoonStudio.apk'):
                  assert 'moon-hmgapi-dev/'+p in names, p
          print('PASS: payload files, service references, APK contents and archive entries')
          PY
          "${ANDROID_HOME}/build-tools/28.0.3/aapt" dump badging build/moon-hmgapi-dev/app/MoonStudio.apk | grep -F "package: name='com.nemesis.moonstudio'"
          file build/moon-hmgapi-dev/moonaudiod | grep -Ei 'arm|ARM'
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-HMGAPI-INTEGRATION-UNTESTED
          path: |
            build/Moon-HMGAPI-INTEGRATION-UNTESTED.zip
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-ALSA-ARMv7-diagnostic-NOT-INSTALLER
          path: |
            build/native/moon_audio_probe
            build/native/moonaudiod
