name: Build Moon Native Audio and Android Integration

on:
  workflow_dispatch:
  push:
    branches: [fix/audio-loopback-ui]
    paths:
      - 'engineering/native/**'
      - 'engineering/hmgapi-mod/**'
      - 'app/**'
      - 'design/approved-moon-studio-concept.html'
      - '.github/workflows/native-audio-probe.yml'

jobs:
  native-probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig and pinned TinyALSA
        run: |
          python3 -m pip install --user ziglang
          git clone https://github.com/tinyalsa/tinyalsa third_party/tinyalsa
          git -C third_party/tinyalsa checkout a7cd26a17fe2add2ff38d2f281ed0b919187a068
      - name: Compile ARMv7 audio diagnostic
        run: bash engineering/native/build-probe.sh
      - name: Check ARM architecture
        run: |
          test -s build/native/moon_audio_probe
          test -s build/native/moonaudiod
          file build/native/moon_audio_probe | grep -E 'ARM|arm'
          file build/native/moonaudiod | grep -E 'ARM|arm'
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Android SDK and Gradle
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;28.0.3"
          wget -q https://services.gradle.org/distributions/gradle-6.7.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-6.7.1/bin/gradle --version
      - name: Transpile approved dashboard for legacy EV6 WebView
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          html=pathlib.Path('design/approved-moon-studio-concept.html').read_text()
          assert '<script' in html and 'MoodLighting' in html
          assert "bar.innerHTML=" in html and 'id="bridgePower"' in html, 'bridge toolbar must be created by JavaScript'
          parts=[]
          def extract(match):
              opening,body=match.group(1),match.group(2)
              if re.search(r'\bsrc\s*=',opening,re.I): return match.group(0)
              parts.append(body)
              return opening+'__MOON_SCRIPT_'+str(len(parts)-1)+'__</script>'
          templ=re.sub(r'(<script\b[^>]*>)([\s\S]*?)</script>',extract,html,flags=re.I)
          out=pathlib.Path('/tmp/moon-dashboard');out.mkdir(exist_ok=True)
          (out/'template.html').write_text(templ)
          for i,part in enumerate(parts):(out/f'script-{i}.js').write_text(part)
          (out/'count').write_text(str(len(parts)))
          assert len(parts) >= 3, 'no scripts extracted from approved interface'
          print('Extracted',len(parts),'inline scripts')
          PY
          npm install --prefix /tmp/moon-dashboard --no-save @babel/core@7 @babel/cli@7 @babel/preset-env@7
          (
            cd /tmp/moon-dashboard
            for js in script-*.js; do
              ./node_modules/.bin/babel "$js" --no-babelrc --presets '@babel/preset-env' --out-file "${js%.js}.legacy.js"
            done
          )
          python3 - <<'PY'
          import pathlib
          folder=pathlib.Path('/tmp/moon-dashboard')
          html=(folder/'template.html').read_text()
          for i in range(int((folder/'count').read_text())):
              js=(folder/f'script-{i}.legacy.js').read_text()
              html=html.replace('__MOON_SCRIPT_'+str(i)+'__',js)
          assert '__MOON_SCRIPT_' not in html
          assert 'MoodLighting' in html
          pathlib.Path('app/src/main/assets/index.html').write_text(html)
          print('Approved dashboard transpiled:',len(html),'characters')
          PY
      - name: Compile APK
        run: |
          java -version
          /tmp/gradle-6.7.1/bin/gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Stage combined HMG-API development payload
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build/moon-hmgapi-dev/app
          cp build/native/moonaudiod build/moon-hmgapi-dev/moonaudiod
          cp app/build/outputs/apk/debug/app-debug.apk build/moon-hmgapi-dev/app/MoonStudio.apk
          cp engineering/hmgapi-mod/mod.json engineering/hmgapi-mod/audio.sh engineering/hmgapi-mod/moon.sh build/moon-hmgapi-dev/
          chmod 755 build/moon-hmgapi-dev/audio.sh build/moon-hmgapi-dev/moon.sh build/moon-hmgapi-dev/moonaudiod
          (cd build && zip -qr Moon-HMGAPI-INTEGRATION-UNTESTED.zip moon-hmgapi-dev)
      - name: Validate integrated APK and native service payload
        run: |
          set -euo pipefail
          test -s build/moon-hmgapi-dev/moonaudiod
          test -s build/moon-hmgapi-dev/app/MoonStudio.apk
          test -s build/moon-hmgapi-dev/audio.sh
          test -s build/moon-hmgapi-dev/mod.json
          sh -n build/moon-hmgapi-dev/audio.sh
          sh -n build/moon-hmgapi-dev/moon.sh
          python3 - <<'PY'
          import json, pathlib, zipfile
          root = pathlib.Path('build/moon-hmgapi-dev')
          mod = json.loads((root/'mod.json').read_text())
          assert mod['id'] == 'moon-studio'
          assert any(a['package'] == 'com.nemesis.moonstudio' and (root/a['apk']).is_file() for a in mod['apps'])
          assert any((root/s['script']).is_file() for s in mod['services'])
          script = (root/'audio.sh').read_text()
          assert '/data/data/com.nemesis.moonstudio/files/settings' in script
          assert 'moonaudiod' in script
          apk = root/'app/MoonStudio.apk'
          with zipfile.ZipFile(apk) as z:
              assert 'classes.dex' in z.namelist()
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'assets/index.html' in z.namelist()
              dashboard=z.read('assets/index.html').decode('utf-8')
              assert 'Mood Studio' in dashboard and 'MoodLighting' in dashboard
              assert 'bridgePower' in dashboard and 'bridgeBrightness' in dashboard
              assert len(dashboard) > 85000, 'approved dashboard not packaged'
          with zipfile.ZipFile('build/Moon-HMGAPI-INTEGRATION-UNTESTED.zip') as z:
              names = set(z.namelist())
              for p in ('moonaudiod','mod.json','audio.sh','moon.sh','app/MoonStudio.apk'):
                  assert 'moon-hmgapi-dev/'+p in names, p
          print('PASS: payload files, service references, APK contents and archive entries')
          PY
          "${ANDROID_HOME}/build-tools/28.0.3/aapt" dump badging build/moon-hmgapi-dev/app/MoonStudio.apk | grep -F "package: name='com.nemesis.moonstudio'"
          file build/moon-hmgapi-dev/moonaudiod | grep -Ei 'arm|ARM'
      - name: Stage v0.2.0-compatible HMG-API mod inputs
        run: |
          set -euo pipefail
          MOD=build/moon-hmgapi-mod
          mkdir -p "$MOD/app" "$MOD/icons" "$MOD/defaults"
          cp app/build/outputs/apk/debug/app-debug.apk "$MOD/app/MoonStudio.apk"
          cp build/native/moonaudiod "$MOD/moonaudiod"
          cp engineering/hmgapi-mod/moon.sh engineering/hmgapi-mod/mod.json "$MOD/"
          # The signer uses the author's key UUID; never replace an existing author identity silently.
          test -s "$MOD/mod.json"
          test -s "$MOD/moonaudiod"
          # Deterministic launcher icons (PNG), generated without external artwork dependencies.
          python3 - <<'PY'
          import pathlib, struct, zlib, math
          out=pathlib.Path('build/moon-hmgapi-mod/icons')
          out.mkdir(parents=True,exist_ok=True)
          def chunk(tag,data):
              return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
          for disabled in (False,True):
              size=128
              rows=[]
              for y in range(size):
                  line=bytearray([0])
                  for x in range(size):
                      dx=(x-63.5)/64;dy=(y-63.5)/64
                      radius=math.hypot(dx,dy)
                      inside=radius<.88
                      # Stylized M monogram with two diagonal strokes.
                      left=abs(x-(35+(y-40)*.31))<5 and 36<y<93
                      right=abs(x-(93-(y-40)*.31))<5 and 36<y<93
                      center=abs(x-64)<4 and 62<y<90
                      mark=inside and (left or right or center)
                      rgb=((107,226,236) if mark else (17,38,59)) if inside else (0,0,0)
                      if disabled:rgb=tuple(int(c*.45) for c in rgb)
                      line.extend((*rgb,255 if inside else 0))
                  rows.append(bytes(line))
              raw=zlib.compress(b''.join(rows),9)
              png=b'\\x89PNG\\r\\n\\x1a\\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',raw)+chunk(b'IEND',b'')
              (out/('tile_disabled.png' if disabled else 'tile.png')).write_bytes(png)
          PY
          printf '0\\n' > "$MOD/defaults/enabled"
          chmod 755 "$MOD/moon.sh" "$MOD/moonaudiod"
          sh -n "$MOD/moon.sh"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('build/moon-hmgapi-mod')
          m=json.loads((root/'mod.json').read_text())
          assert m['id']=='moon-studio'
          for app in m['apps']: assert (root/app['apk']).is_file()
          for service in m['services']: assert (root/service['script']).is_file()
          for launch in m['provides']['launcher']:
              for field in ('icon','icon_disabled'):
                  p=root/launch[field]
                  assert p.is_file(), 'Missing required launcher icon: '+str(p)
          print('PASS: HMG-API mod inputs including launcher icons staged')
          PY
      - name: Publish diagnostic APK and native daemon even when signing is unavailable
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Studio-UNSIGNED-DIAGNOSTICS-NOT-FOR-NEMESIS
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/native/moonaudiod
            build/native/moon_audio_probe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-HMGAPI-INTEGRATION-UNTESTED
          path: |
            build/Moon-HMGAPI-INTEGRATION-UNTESTED.zip
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Moon-ALSA-ARMv7-diagnostic-NOT-INSTALLER
          path: |
            build/native/moon_audio_probe
            build/native/moonaudiod
      - name: Validate release packaging scripts before signing
        run: |
          python3 -m py_compile engineering/wrap_signed_hmgapi_mod.py engineering/verify_nemesis_hmg_package.py
          python3 engineering/wrap_signed_hmgapi_mod.py --help >/dev/null
      - name: Check whether release signing is configured
        id: signing
        env:
          HMGAPI_SIGNING_KEY_BASE64: ${{ secrets.MOON_HMG_SIGNING_KEY_B64 }}
        run: |
          if [ -n "$HMGAPI_SIGNING_KEY_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing key not configured; diagnostic artifacts remain available, but no vehicle installer will be produced."
          fi
      - name: Build signed mod and official NEMESIS USB wrapper
        if: steps.signing.outputs.available == 'true'
        env:
          HMGAPI_SIGNING_KEY_BASE64: ${{ secrets.MOON_HMG_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/VysseCodes/HMG-API.git build/hmgapi-tools
          KEY="$(mktemp)"
          trap 'rm -f "$KEY" "$KEY.pub"' EXIT
          # Normalize EC private keys to Java-compatible PKCS#8 v0 while
          # preserving the existing public/private key pair and author UUID.
          RAW_KEY="$(mktemp)"
          trap 'rm -f "$KEY" "$KEY.pub" "$RAW_KEY"' EXIT
          printf '%s' "$HMGAPI_SIGNING_KEY_BASE64" | base64 -d > "$RAW_KEY"
          openssl pkcs8 -topk8 -nocrypt -inform DER -outform DER -in "$RAW_KEY" | base64 -w0 > "$KEY"
          printf '\n' >> "$KEY"
          chmod 600 "$KEY"
          base64 -d "$KEY" | openssl pkey -inform DER -pubout -outform DER | base64 -w0 > "$KEY.pub"
          printf '\n' >> "$KEY.pub"
          chmod 600 "$KEY.pub"
          cd build/hmgapi-tools
          sh tools/mkmodpkg.sh "$GITHUB_WORKSPACE/build/moon-hmgapi-mod" "$KEY"
          sh tools/mknemesismod.sh "out/packages/moon-studio-0.3.0.zip" "$GITHUB_WORKSPACE/build/signed-release"
          cd "$GITHUB_WORKSPACE"
          # Use HMG-API's official NEMESIS USB archive unchanged, as Kyle does.
          unzip -t build/signed-release/moon-studio-0.3.0-nemesis.zip >/dev/null
          python3 engineering/verify_nemesis_hmg_package.py build/signed-release/moon-studio-0.3.0-nemesis.zip
          echo "Signed package built and structurally checked; in-vehicle behavior remains unverified."
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: Moon-Studio-SIGNED-HMGAPI-NEMESIS-UNTESTED
          path: build/signed-release/*
