name: Pet Lounge Phone Preview APK
on:
  push:
    paths:
      - '.github/workflows/pet-lounge-phone.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android preview
        run: |
          set -eux
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$SDK/build-tools/35.0.0"
          mkdir -p build/src/com/petlounge/preview build/assets build/classes build/dex
          cat > build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.petlounge.preview"><uses-sdk android:minSdkVersion="26" android:targetSdkVersion="28"/><application android:label="Pet Lounge Preview" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > build/src/com/petlounge/preview/MainActivity.java <<'EOF'
          package com.petlounge.preview;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            WebView web;
            public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(0xff090b17);getWindow().setNavigationBarColor(0xff090b17);web=new WebView(this);web.setBackgroundColor(0xff090b17);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setDomStorageEnabled(true);setContentView(web);web.loadUrl("file:///android_asset/index.html");}
            public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          EOF
          cat > build/assets/index.html <<'EOF'
          <!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>
          :root{--c:#b58cff}*{box-sizing:border-box}body{margin:0;background:#0b0d1d;color:white;font:16px system-ui}.wrap{padding:20px;min-height:100vh;background:radial-gradient(ellipse at 50% 34%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%)}header{letter-spacing:4px;color:#d9c7ff;font-size:13px}h1{font-size:27px;margin-bottom:3px}small{color:#b7b9cb}.stage{border:1px solid #ffffff30;border-radius:28px;background:#ffffff0c;margin:20px 0;padding:22px;text-align:center;min-height:330px;box-shadow:0 20px 60px #0008}.pet{font-size:115px;margin:20px 0 0;animation:bob 2s infinite ease-in-out}.play{animation:play 1.4s infinite ease-in-out}.peek{animation:peek 3s infinite ease-in-out}.prop{font-size:40px}.msg{font-size:21px;font-weight:650;margin:12px auto}.temp{font-size:45px;font-weight:300;text-shadow:0 0 18px var(--c)}.large{font-size:75px}.warn{font-size:11px;color:#ffcc9b}.panel{border:1px solid #ffffff25;background:#ffffff0b;border-radius:22px;padding:15px}label{display:block;color:#b8bad2;font-size:12px;margin:12px 0 5px}.row{display:flex;gap:8px}button,select,input{border:1px solid #ffffff30;background:#272941;color:white;padding:12px;border-radius:12px;font:inherit;min-width:0}button,select{flex:1}button.active{background:var(--c);color:#151025}input[type=text],input[type=range]{width:100%}input[type=range]{accent-color:var(--c)}footer{font-size:12px;color:#a8a9bb;text-align:center;padding:15px}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes play{25%{transform:rotate(-9deg) translateX(-8px)}75%{transform:rotate(9deg) translateX(8px)}}@keyframes peek{25%{transform:translateX(-65px)}75%{transform:translateX(65px)}}
          </style></head><body><div class="wrap"><header>✦ PET LOUNGE</header><h1>Your pet. Your lounge.</h1><small>Android concept preview</small><div class="stage"><div class="pet play" id="pet">🐈</div><div class="prop" id="prop">🧶</div><div class="msg" id="msg">My human will be back soon! 💜</div><div class="temp" id="temp">72°F</div><div class="warn">DEMO TEMPERATURE — NOT LIVE VEHICLE DATA</div></div><div class="panel"><label>Pet</label><div class="row"><button id="cat" class="active" onclick="pet('cat')">🐈 Cat</button><button id="dog" onclick="pet('dog')">🐕 Dog</button></div><label>Animation</label><div class="row"><select id="motion" onchange="update()"><option value="play">Playful</option><option value="">Relaxing</option><option value="peek">Peekaboo</option></select><select id="activity" onchange="update()"><option value="yarn">Yarn / Ball</option><option value="biscuits">Biscuits</option><option value="sniff">Sniff</option><option value="bone">Bone</option></select></div><label>Custom message</label><input type="text" id="custom" value="My human will be back soon! 💜" oninput="update()"><label>Temperature size</label><input type="range" min="0" max="1" value="0" id="size" oninput="update()"><label>Lighting palette</label><div class="row"><button onclick="color('#b58cff')">Violet</button><button onclick="color('#63d6e8')">Aqua</button><button onclick="color('#f6ad77')">Sunset</button></div></div><footer>Preview only · No climate or vehicle control</footer></div><script>let p='cat';function pet(x){p=x;document.getElementById('cat').classList.toggle('active',x==='cat');document.getElementById('dog').classList.toggle('active',x==='dog');update()}function color(x){document.documentElement.style.setProperty('--c',x)}function update(){document.getElementById('pet').textContent=p==='cat'?'🐈':'🐕';document.getElementById('pet').className='pet '+document.getElementById('motion').value;document.getElementById('prop').textContent=({yarn:'🧶',biscuits:'🐾',sniff:'🌼',bone:'🦴'})[document.getElementById('activity').value];document.getElementById('msg').textContent=document.getElementById('custom').value;document.getElementById('temp').classList.toggle('large',document.getElementById('size').value==='1')}update()</script></body></html>
          EOF
          "$BT/aapt" package -f -M build/AndroidManifest.xml -I "$SDK/platforms/android-35/android.jar" -A build/assets -F build/unsigned.apk
          javac -source 8 -target 8 -classpath "$SDK/platforms/android-35/android.jar" -d build/classes build/src/com/petlounge/preview/MainActivity.java
          "$BT/d8" --min-api 26 --output build/dex $(find build/classes -name '*.class')
          (cd build/dex && zip -q -u ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.jks -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Pet Lounge Preview" -noprompt
          "$BT/apksigner" sign --ks build/debug.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias preview --out pet-lounge-preview.apk build/aligned.apk
          "$BT/apksigner" verify --verbose pet-lounge-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pet-lounge-s26-ultra-preview-apk
          path: pet-lounge-preview.apk
