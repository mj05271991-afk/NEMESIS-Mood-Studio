name: Build NEMESIS Android APK

on:
  push:
    branches: [ main, moon-native-arm32-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Audit first-test safety scope
        run: |
          ! grep -F 'android.permission.RECORD_AUDIO' app/src/main/AndroidManifest.xml
          ! grep -F 'android:exported=' app/src/main/AndroidManifest.xml
          grep -F 'requestSMLStatus' app/src/main/java/com/nemesis/moonstudio/Ev6LightingProbe.java
          ! grep -F 'binder.transact(' app/src/main/java/com/nemesis/moonstudio/Ev6LightingProbe.java
          grep -F 'setSMLRGB' app/src/main/java/com/nemesis/moonstudio/Ev6LightingController.java
          grep -F 'setSMLConfiguration' app/src/main/java/com/nemesis/moonstudio/Ev6LightingController.java
          ! grep -E 'setColor|setBrightness|writeColor|writeLighting' app/src/main/java/com/nemesis/moonstudio/Ev6LightingProbe.java

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package identity
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/28.0.3/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.nemesis.moonstudio'"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "launchable-activity: name='com.nemesis.moonstudio.MoonStudioActivity'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEMESIS-Moon-Studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Assemble NEMESIS installer files
        run: |
          mkdir -p nemesis-package/app
          cp app/build/outputs/apk/debug/app-debug.apk nemesis-package/app/NEMESIS-Moon-Studio.apk
          cat > nemesis-package/NEMESIS.data <<'EOF'
          [nemesis]
          version=1.1
          id=moon.studio
          name=NEMESIS Moon Studio
          type=application
          package-version=0.2
          short-desc=Direct EV6 ambient lighting control with static, rainbow and dual-color effects
          os=*.260507
          models=any

          [app.0]
          kind=apk
          path=app/NEMESIS-Moon-Studio.apk
          package=com.nemesis.moonstudio
          component=com.nemesis.moonstudio/com.nemesis.moonstudio.MoonStudioActivity
          EOF

      - name: Validate and zip NEMESIS installer
        run: |
          test -s nemesis-package/NEMESIS.data
          test -s nemesis-package/app/NEMESIS-Moon-Studio.apk
          grep -F "package=com.nemesis.moonstudio" nemesis-package/NEMESIS.data
          (cd nemesis-package && zip -qr ../NEMESIS-Moon-Studio-installer.zip .)
          unzip -l NEMESIS-Moon-Studio-installer.zip

      - name: Retrieve verified ARMv7 native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p native-staging
          gh run download 42251434113 --repo "${{ github.repository }}" --name moon-arm32-staging-library --dir native-staging
          find native-staging -type f -print
          DIAG=$(find native-staging -type f -name ev6-diagnostics.zip -print -quit)
          test -n "$DIAG"
          unzip -t "$DIAG"
          cp "$DIAG" native-staging/verified-ev6-diagnostics.zip

      - name: Package combined APK and native diagnostic binaries
        run: |
          mkdir -p combined-staging/app combined-staging/native
          cp app/build/outputs/apk/debug/app-debug.apk combined-staging/app/Moon-Studio.apk
          cp native-staging/verified-ev6-diagnostics.zip combined-staging/native/ev6-diagnostics.zip
          printf '%s\\n' 'STAGING ONLY: Not a vehicle-installable NEMESIS bundle.' 'Contains Android APK and compiled native diagnostics from successful native CI run 42251434113.' 'No background daemon installation or vehicle music-reactive lighting integration yet.' > combined-staging/README.txt
          (cd combined-staging && zip -qr ../Moon-Studio-combined-staging.zip .)
          unzip -t Moon-Studio-combined-staging.zip

      - name: Assemble Moon Studio launcher NEMESIS USB installer
        run: |
          mkdir -p launcher-usb/packages
          cp NEMESIS-Moon-Studio-installer.zip launcher-usb/packages/moon.studio.zip
          cat > launcher-usb/NEMESIS.data <<'EOF'
          [nemesis]
          version=1.0
          type=install
          path=packages/moon.studio.zip
          EOF
          cat > launcher-usb/README.txt <<'EOF'
          Moon Studio Android launcher installer (not the HMG-API lighting daemon).
          Installs com.nemesis.moonstudio. Use with the separately signed Moon Studio HMG mod.
          Only test while parked. Do not activate both Moon Studio and Light Vibes services.
          EOF
          unzip -p launcher-usb/packages/moon.studio.zip NEMESIS.data | grep -F 'package=com.nemesis.moonstudio'
          unzip -l launcher-usb/packages/moon.studio.zip | grep -F 'app/NEMESIS-Moon-Studio.apk'
          (cd launcher-usb && zip -qr ../Moon-Studio-Launcher-NEMESIS-USB.zip .)
          unzip -t Moon-Studio-Launcher-NEMESIS-USB.zip
          unzip -p Moon-Studio-Launcher-NEMESIS-USB.zip NEMESIS.data | grep -F 'path=packages/moon.studio.zip'

      - name: Upload launcher NEMESIS USB installer
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Studio-Launcher-NEMESIS-USB
          path: Moon-Studio-Launcher-NEMESIS-USB.zip

      - name: Upload combined staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Studio-combined-staging
          path: Moon-Studio-combined-staging.zip

      - name: Upload NEMESIS installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEMESIS-Moon-Studio-installer
          path: NEMESIS-Moon-Studio-installer.zip
