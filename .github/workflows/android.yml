
name: Build NEMESIS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"
      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEMESIS-Moon-Studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Assemble NEMESIS installer package
        run: |
          mkdir -p nemesis-package/app
          cp app/build/outputs/apk/debug/app-debug.apk nemesis-package/app/NEMESIS-Moon-Studio.apk
          cat > nemesis-package/NEMESIS.data <<'EOF'
          [nemesis]
          version=1.1
          id=moon.studio
          name=NEMESIS Moon Studio
          type=application
          package-version=0.2
          short-desc=Music-reactive lighting studio for Gen5W EV6
          os=*.260507
          models=any

          [app.0]
          kind=apk
          path=app/NEMESIS-Moon-Studio.apk
          package=com.nemesis.moonstudio
          component=com.nemesis.moonstudio/com.nemesis.moonstudio.MoonStudioActivity
          EOF
          cd nemesis-package
          zip -r ../NEMESIS-Moon-Studio-0.2.zip NEMESIS.data app

      - name: Upload NEMESIS installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEMESIS-Moon-Studio-installer
          path: NEMESIS-Moon-Studio-0.2.zip
