name: Moon Studio ARM32 Native Library (staging)
on:
  push:
    branches: [moon-native-arm32-integration]
    paths:
      - 'native/**'
      - '.github/workflows/native-arm32.yml'
  workflow_dispatch:
jobs:
  arm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source import
        run: |
          test -f native/build-android-arm32.sh
          test -f native/native_verified_controller.c
      - name: Install Android NDK r27c
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
      - name: Build native ARM32 library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          bash native/build-android-arm32.sh
          bash native/verify-arm32-library.sh
          test -s native/arm32-ndk-build/moonstudiod
          file native/arm32-ndk-build/moonstudiod | grep -E 'ELF 32-bit.*ARM'
      - name: Run offline audio regression tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 native/moonstudiod.c native/moon_audio_backend.c -lm -o /tmp/moonstudiod-host
          /tmp/moonstudiod-host --self-test
          python3 - <<'PY'
          import math, struct
          with open('/tmp/moon-test.raw', 'wb') as f:
              for i in range(4800):
                  v = int(12000 * math.sin(2 * math.pi * 440 * i / 48000))
                  f.write(struct.pack('<hh', v, v))
          PY
          /tmp/moonstudiod-host --analyze /tmp/moon-test.raw | tee /tmp/moon-meter.txt
          python3 -c "import re; s=open('/tmp/moon-meter.txt').read(); m=re.search(r'frames=(\\d+) rms=([0-9.]+) peak=([0-9.]+)',s); assert m and int(m[1])==4800 and .25<float(m[2])<.27 and .36<float(m[3])<.38, s"
      - name: Verify FFT bass mid and treble classification
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 native/test_audio_bands.c native/moon_audio_backend.c -lm -o /tmp/test_audio_bands
          /tmp/test_audio_bands
      - name: Compile music-to-light bridge with strict warnings
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 -c native/moon_music_light_bridge.c -o /tmp/moon_music_light_bridge.o
          test -s /tmp/moon_music_light_bridge.o
      - name: Test music-to-light bridge against mock hardware
        run: |
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Werror -O2 native/test_music_light_bridge.c native/moon_music_light_bridge.c native/native_controller.c native/native_lighting_session.c native/native_ownership_lock.c -lm -o /tmp/test_music_light_bridge
          /tmp/test_music_light_bridge
      - name: Install Zig for static ARMv7 build
        run: |
          python3 -m pip install --user ziglang==0.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build static musl ARMv7 daemon
        run: |
          export ZIG="$HOME/.local/bin/python3 -m ziglang"
          python3 -m ziglang cc -target arm-linux-musleabihf -mcpu=cortex_a7 -static -O2 -std=c11 -Wall -Wextra -Werror -o native/arm32-ndk-build/moonstudiod-static native/moonstudiod.c native/moon_audio_backend.c -lm
          file native/arm32-ndk-build/moonstudiod-static | grep -E 'ELF 32-bit.*ARM'
          ! readelf -l native/arm32-ndk-build/moonstudiod-static | grep -q INTERP
      - name: Compile read-only EV6 tinyalsa probe
        run: |
          ZIG="python3 -m ziglang" bash native/build-alsa-probe.sh
      - name: Verify Kyle-derived full music lighting daemon
        run: |
          test -s native/arm32-static-build/moon-lightd
          file native/arm32-static-build/moon-lightd | grep -E 'ELF 32-bit.*ARM'
          ! readelf -l native/arm32-static-build/moon-lightd | grep -q INTERP
      - name: Package EV6 diagnostic binaries
        run: |
          mkdir -p native/ev6-diagnostics
          cp native/arm32-static-build/moon-alsa-probe native/ev6-diagnostics/
          cp native/arm32-static-build/moon-lightd native/ev6-diagnostics/
          cp native/arm32-ndk-build/moonstudiod-static native/ev6-diagnostics/
          printf '%s\\n' 'EV6 diagnostic build, NOT a NEMESIS installable package.' 'No vehicle writes are enabled.' 'Do not run --monitor-loopback until in-car recovery procedure is verified.' 'Read-only: moon-alsa-probe --probe' > native/ev6-diagnostics/README.txt
          (cd native && zip -q -r ev6-diagnostics.zip ev6-diagnostics)
      - name: Set up Java 8 for Android 4.4 APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'
      - name: Install Android SDK for Moon Studio
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-28" "build-tools;28.0.3"
      - name: Build and verify Moon Studio launcher APK
        run: |
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" | grep -F "package: name='com.nemesis.moonstudio'"
          "$ANDROID_HOME/build-tools/28.0.3/aapt" dump badging "$APK" | grep -F "launchable-activity: name='com.nemesis.moonstudio.MoonStudioActivity'"
          "$ANDROID_HOME/build-tools/28.0.3/apksigner" verify --min-sdk-version 19 --verbose "$APK" | grep -F 'Verified using v1 scheme (JAR signing): true'
      - name: Package HMG opt-in diagnostic service staging
        run: |
          mkdir -p native/hmg-staging/app native/hmg-staging/icons
          cp app/build/outputs/apk/debug/app-debug.apk native/hmg-staging/app/MoonStudio.apk
          python3 - <<'PYICON'
          import struct, zlib, pathlib
          root=pathlib.Path('native/hmg-staging/icons')
          def png(path, color):
              w=h=96
              raw=b''.join(b'\x00'+bytes(color)*w for _ in range(h))
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              path.write_bytes(b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b''))
          png(root/'tile.png',(92,42,174))
          png(root/'tile_disabled.png',(78,78,78))
          PYICON
          cp native/hmg-mod/moon.sh native/hmg-staging/moon.sh
          cp native/hmg-mod/mod.json native/hmg-staging/mod.json
          cp native/arm32-static-build/moon-alsa-probe native/hmg-staging/moon-alsa-probe
          cp native/arm32-static-build/moon-lightd native/hmg-staging/moon-lightd
          mkdir -p native/hmg-staging/defaults
          echo 0 > native/hmg-staging/defaults/enabled
          cp native/upstream-lightvibes/LICENSE native/hmg-staging/LICENSE
          chmod 755 native/hmg-staging/moon.sh native/hmg-staging/moon-alsa-probe native/hmg-staging/moon-lightd
          sh -n native/hmg-staging/moon.sh
          file native/hmg-staging/moon-alsa-probe | grep -E 'ELF 32-bit.*ARM'
          ! readelf -l native/hmg-staging/moon-alsa-probe | grep -q INTERP
          grep -F 'enable_moon_lighting' native/hmg-staging/moon.sh
          grep -F 'pidof lightvibesd' native/hmg-staging/moon.sh
          grep -F 'moon-lightd' native/hmg-staging/moon.sh
          test "$(cat native/hmg-staging/defaults/enabled)" = 0
          python3 - <<'PY'
          import json
          with open('native/hmg-staging/mod.json') as f: m=json.load(f)
          assert m['id']=='moon-studio'
          assert m['apps'][0]['package']=='com.nemesis.moonstudio'
          assert m['apps'][0]['apk']=='app/MoonStudio.apk'
          assert m['provides']['launcher'][0]['class']=='.MoonStudioActivity'
          assert m['provides']['launcher'][0]['package']=='com.nemesis.moonstudio'
          assert m['services'][0]['script']=='moon.sh'
          assert m['services'][0]['restart'] is True
          assert m['services'][0]['name']=='moon-lighting'
          PY
          (cd native/hmg-staging && zip -qr ../moon-hmg-diagnostics-staging.zip .)
          unzip -t native/moon-hmg-diagnostics-staging.zip
          # The staging archive is not a signed installer.
          if unzip -Z1 native/moon-hmg-diagnostics-staging.zip | grep -q '^META-HMGAPI/manifest.json$'; then
            echo 'Unexpected signed manifest in staging archive'
            exit 1
          fi
          test -s native/hmg-staging/app/MoonStudio.apk
          test -s native/hmg-staging/icons/tile.png
          test -s native/hmg-staging/icons/tile_disabled.png
          test -s native/hmg-staging/moon-lightd
          test -s native/hmg-staging/LICENSE
      - name: Sign HMG package and wrap for NEMESIS when signing key is configured
        env:
          MOON_SIGNING_KEY_B64: ${{ secrets.MOON_HMG_SIGNING_KEY_B64 }}
          MOON_SIGNING_PUB_B64: ${{ secrets.MOON_HMG_SIGNING_PUB_B64 }}
        run: |
          if [ -z "$MOON_SIGNING_KEY_B64" ] || [ -z "$MOON_SIGNING_PUB_B64" ]; then
            echo 'Signing secrets absent: unsigned staging only (not installable).'
            exit 0
          fi
          mkdir -p native/signed-dist
          umask 077
          printf '%s' "$MOON_SIGNING_KEY_B64" > /tmp/moon-signing-key
          printf '%s' "$MOON_SIGNING_PUB_B64" > /tmp/moon-signing-key.pub
          git clone --depth 1 https://github.com/VysseCodes/HMG-API.git /tmp/moon-hmgapi
          python3 native/tools/sign-hmg.py native/hmg-staging native/signed-dist /tmp/moon-signing-key /tmp/moon-hmgapi
          rm -f /tmp/moon-signing-key /tmp/moon-signing-key.pub
          test -n "$(find native/signed-dist -name '*nemesis-usb.zip' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: moon-signed-nemesis-installers
          if-no-files-found: ignore
          path: native/signed-dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: moon-arm32-staging-library
          path: |
            native/moon-hmg-diagnostics-staging.zip
            native/ev6-diagnostics.zip
            native/arm32-ndk-build/moonstudiod
            native/arm32-ndk-build/moonstudiod-static
            native/arm32-static-build/moon-lightd
            native/arm32-static-build/moon-alsa-probe
            native/arm32-ndk-build/libmoon_controller.a
            native/arm32-ndk-build/archive-members.txt
            native/arm32-ndk-build/unresolved-symbols.txt
