name: Moon Studio ARM32 Native Library (staging)
on:
  push:
    branches: [moon-native-arm32-integration]
    paths:
      - 'native/**'
      - '.github/workflows/native-arm32.yml'
  workflow_dispatch:
jobs:
  arm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify native source import
        run: |
          test -f native/build-android-arm32.sh
          test -f native/native_verified_controller.c
      - name: Install Android NDK r27c
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018'
      - name: Build native ARM32 library
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          bash native/build-android-arm32.sh
          bash native/verify-arm32-library.sh
          test -s native/arm32-ndk-build/moonstudiod
          file native/arm32-ndk-build/moonstudiod | grep -E 'ELF 32-bit.*ARM'
      - name: Run offline audio regression tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 native/moonstudiod.c native/moon_audio_backend.c -lm -o /tmp/moonstudiod-host
          /tmp/moonstudiod-host --self-test
          python3 - <<'PY'
          import math, struct
          with open('/tmp/moon-test.raw', 'wb') as f:
              for i in range(4800):
                  v = int(12000 * math.sin(2 * math.pi * 440 * i / 48000))
                  f.write(struct.pack('<hh', v, v))
          PY
          /tmp/moonstudiod-host --analyze /tmp/moon-test.raw | tee /tmp/moon-meter.txt
          python3 -c "import re; s=open('/tmp/moon-meter.txt').read(); m=re.search(r'frames=(\\d+) rms=([0-9.]+) peak=([0-9.]+)',s); assert m and int(m[1])==4800 and .25<float(m[2])<.27 and .36<float(m[3])<.38, s"
      - name: Install Zig for static ARMv7 build
        run: |
          python3 -m pip install --user ziglang==0.13.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build static musl ARMv7 daemon
        run: |
          export ZIG="$HOME/.local/bin/python3 -m ziglang"
          python3 -m ziglang cc -target arm-linux-musleabihf -mcpu=cortex_a7 -static -O2 -std=c11 -Wall -Wextra -Werror -o native/arm32-ndk-build/moonstudiod-static native/moonstudiod.c native/moon_audio_backend.c -lm
          file native/arm32-ndk-build/moonstudiod-static | grep -E 'ELF 32-bit.*ARM'
          ! readelf -l native/arm32-ndk-build/moonstudiod-static | grep -q INTERP
      - uses: actions/upload-artifact@v4
        with:
          name: moon-arm32-staging-library
          path: |
            native/arm32-ndk-build/moonstudiod
            native/arm32-ndk-build/moonstudiod-static
            native/arm32-ndk-build/libmoon_controller.a
            native/arm32-ndk-build/archive-members.txt
            native/arm32-ndk-build/unresolved-symbols.txt
